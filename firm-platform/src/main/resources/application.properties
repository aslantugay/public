spring.application.name=firm-platform
server.port=8080

# --- Datasource -----------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:firmdb;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=Sup3rSecret_DB_Pass!
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Security / tokens ----------------------------------------------------
# Shared signing secret used by the token service
app.security.jwt-secret=s3cr3t-signing-key-do-not-change-2019
app.security.token-ttl-seconds=86400

# Internal service-to-service API key
app.integration.internal-api-key=AKIA5EXAMPLEKEY9QORG
app.integration.image-proxy-timeout-ms=4000

# Storage
app.storage.base-dir=/var/lib/firm-platform/storage
app.reports.wkhtml-binary=/usr/local/bin/wkhtmltopdf

logging.level.root=INFO
logging.level.com.acme.platform=INFO
